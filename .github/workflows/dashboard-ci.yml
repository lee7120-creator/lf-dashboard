name: "대시보드 검사"

# 머지 전에 '열자마자 죽는' 회귀를 막는다.
# 2026-07 전역 헬퍼 섀도잉(`_s`) 사고로 11개 페이지가 전부 다운된 적이 있어서,
# 정적 검사(빠름) + 전 페이지 실제 렌더(느리지만 확실) 두 겹으로 본다.
#
# 검사 목록은 여기 적지 않는다 — **`tests/ci_shards.py` 한곳**이다. 워크플로에
# 또 적으면 새 검사를 한쪽에만 넣었을 때 **CI에서 조용히 빠진다**. 관문(gate)이
# `--verify`로 표와 `tests/` 디렉터리를 대조하고, 샤드 목록도 `--matrix`가 준다.

on:
  pull_request:
    branches: [main]
    paths:
      - "send_perf_dashboard.py"
      - "weekly_report.py"
      # 두 앱 공용 모듈 — 여기 안 넣으면 이것만 고친 PR이 «검사 없이» 머지된다
      - "chart_layout.py"
      - "note_markdown.py"
      - "note_editor.py"
      - "table_export.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/dashboard-ci.yml"
  push:
    branches: [main]
    paths:
      - "send_perf_dashboard.py"
      - "weekly_report.py"
      - "chart_layout.py"
      - "note_markdown.py"
      - "note_editor.py"
      - "table_export.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

concurrency:                      # 같은 PR에 연달아 푸시하면 이전 실행은 취소
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 관문 ─────────────────────────────────────────────────────────────
  # 몇 초짜리 정적 검사만 먼저 본다. 문법이 깨졌으면 러너 셋을 11분씩 태우지
  # 않고 1분에 끝낸다. 샤드 목록도 여기서 꺼내 아래 매트릭스에 넘긴다.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.shards.outputs.ids }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 문법 검사
        run: |
          python -m compileall -q send_perf_dashboard.py weekly_report.py \
                                 chart_layout.py note_markdown.py note_editor.py \
                                 table_export.py

      - name: 샤드 표 ↔ 검사 디렉터리 대조
        run: python tests/ci_shards.py --verify

      - name: 전역 헬퍼 섀도잉 검사
        run: python tests/ci_shards.py --run gate

      - name: 샤드 목록
        id: shards
        run: echo "ids=$(python tests/ci_shards.py --matrix)" >> "$GITHUB_OUTPUT"

  # ── 샤드 ─────────────────────────────────────────────────────────────
  # 직렬 30분을 셋으로 나눠 동시에 돈다. 벽시계의 바닥은 «제일 느린 파일 하나»
  # (`test_weekly_perf` 10.8분)라 더 쪼개도 안 줄어든다.
  tests:
    needs: gate
    runs-on: ubuntu-latest
    # 제일 긴 샤드가 11분쯤이다. 러너가 느린 날을 감안해 두 배 남짓 둔다.
    timeout-minutes: 30
    strategy:
      fail-fast: false            # 한 샤드가 깨져도 나머지 결과를 같이 본다
      matrix:
        shard: ${{ fromJSON(needs.gate.outputs.shards) }}
    name: "검사 샤드 ${{ matrix.shard }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 샤드 ${{ matrix.shard }} 실행
        run: python tests/ci_shards.py --run ${{ matrix.shard }}

  # ── 합류 ─────────────────────────────────────────────────────────────
  # 브랜치 보호에 걸 검사는 이것 하나다. 샤드가 늘고 줄어도 이름이 안 바뀐다.
  all-green:
    if: always()
    needs: [gate, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 관문·샤드 결과 확인
        run: |
          echo "관문: ${{ needs.gate.result }} / 샤드: ${{ needs.tests.result }}"
          [ "${{ needs.gate.result }}" = "success" ] \
            || { echo "::error::관문이 통과하지 못했어요"; exit 1; }
          [ "${{ needs.tests.result }}" = "success" ] \
            || { echo "::error::검사 샤드가 통과하지 못했어요"; exit 1; }
          echo "전부 초록 ✅"
